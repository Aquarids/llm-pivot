[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pivot"
dynamic = ["version"]
description = "A unified LLM wrapper for online APIs and local models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "aquarids", email = "aquarids.moe@gmail.com"}
]
keywords = ["llm", "openai", "ollama", "embedding", "reranking", "wrapper"]

dependencies = [
    "openai>=1.66.0",
    "ollama>=0.1.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Repository = "https://github.com/Aquarids/llm-pivot"
Documentation = "https://github.com/Aquarids/llm-pivot#readme"
Issues = "https://github.com/Aquarids/llm-pivot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "llmpivot.__version__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "-s"]
