[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pivot"
version = "0.0.8"
description = "A unified LLM wrapper for online APIs and local models"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "aquarids", email = "aquarids.moe@gmail.com"}
]
keywords = ["llm", "wrapper"]

dependencies = [
    "openai>=1.0.0",
    "ollama>=0.1.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Repository = "https://github.com/yourusername/llm-pivot"
Documentation = "https://github.com/yourusername/llm-pivot/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "-s"]